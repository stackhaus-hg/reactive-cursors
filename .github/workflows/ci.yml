name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install package dependencies
        run: |
          cd package
          npm ci

      - name: Check Prettier formatting
        run: |
          npm run format:check
          if [ $? -ne 0 ]; then
            echo "❌ Code is not properly formatted. Run 'npm run format' to fix."
            echo "::error::Code formatting check failed"
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi

      - name: Run ESLint
        run: |
          npm run lint
          if [ $? -ne 0 ]; then
            echo "❌ Linting failed. Run 'npm run lint:fix' to fix auto-fixable issues."
            echo "::error::ESLint check failed"
            exit 1
          else
            echo "✅ Linting passed"
          fi

      - name: TypeScript type checking
        run: |
          cd package
          npx tsc --noEmit
          if [ $? -ne 0 ]; then
            echo "❌ TypeScript type checking failed"
            echo "::error::TypeScript check failed"
            exit 1
          else
            echo "✅ TypeScript types are valid"
          fi

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          npm run build:package
          if [ $? -ne 0 ]; then
            echo "❌ Package build failed"
            echo "::error::Build failed"
            exit 1
          else
            echo "✅ Package built successfully"
          fi

      - name: Check build output
        run: |
          if [ ! -d "package/dist" ]; then
            echo "❌ Build output directory not found"
            exit 1
          fi

          if [ ! -f "package/dist/index.esm.js" ] || [ ! -f "package/dist/index.cjs.js" ]; then
            echo "❌ Expected build files not found"
            exit 1
          fi

          echo "✅ Build output validation passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: package/dist/
          retention-days: 7

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: |
          cd package
          npm run build-storybook
          if [ $? -ne 0 ]; then
            echo "❌ Storybook build failed"
            echo "::error::Storybook build failed"
            exit 1
          else
            echo "✅ Storybook built successfully"
          fi

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: package/storybook-static/
          retention-days: 7
